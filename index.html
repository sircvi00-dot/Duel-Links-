<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue-Eyes Speed Duel Trainer</title>
<meta name="theme-color" content="#eef2f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef2f6; --ink:#1c2433; --sapph:#1f5fa8; --sapph2:#163f73; --silver:#8a96a8; --glacier:#dbe6f2; --mute:#5c6678; --warn:#b3361e;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --ui:"Barlow Semi Condensed","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--paper)}
html,body{margin:0;min-height:100%}
body{font-family:var(--ui);color:var(--ink);font-size:16px;line-height:1.45;background:linear-gradient(180deg,#f4f7fa 0%,#e9eef4 100%);background-attachment:fixed;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent}
button{font-family:var(--ui);font-size:15px;color:var(--ink);background:#fff;border:1px solid rgba(31,95,168,.35);border-radius:6px;padding:9px 13px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--sapph);background:rgba(31,95,168,.07)}
button:focus-visible{outline:2px solid var(--sapph);outline-offset:2px}
button.primary{background:var(--sapph);border-color:var(--sapph);color:#fff;font-weight:600}
button:disabled{opacity:.4}
.app{max-width:1100px;margin:0 auto;padding:10px 10px 18px;display:grid;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:19px;margin:0;letter-spacing:.04em;color:var(--sapph2);white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{padding:6px 10px;min-height:36px;font-size:14px}
.tabs button.on{background:var(--sapph);color:#fff;border-color:var(--sapph);font-weight:600}
@media (max-width:430px){.tabs{width:100%}.tabs button{flex:1;padding:6px 4px}}
.lp{display:flex;justify-content:space-between;font-family:var(--display);font-size:14px;color:var(--mute);padding:0 4px}
.lp b{color:var(--ink);font-size:17px;margin-left:6px}
.stage{position:relative;width:100%;margin:0 auto;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.board{position:absolute;left:0;top:0;width:100%;border-radius:10px;overflow:hidden;
  background:radial-gradient(ellipse 60% 30% at 50% 50%,rgba(255,255,255,.7),transparent 70%),linear-gradient(180deg,#e6ebf1 0%,#dbe6f2 48%,#d3e1f0 52%,#e2e9f1 100%);
  border:1px solid rgba(22,63,115,.18)}
.eye{position:absolute;left:50%;transform:translate(-50%,-50%);border:1px solid rgba(31,95,168,.16);border-radius:50%/50%;pointer-events:none}
.eye::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(31,95,168,.2)}
.zone{position:absolute;border:1px solid rgba(22,63,115,.18);background:rgba(255,255,255,.5);border-radius:4px}
.zone.opp{background:rgba(245,240,240,.55);border-color:rgba(120,80,80,.2)}
.zone.pilez{border-style:dashed}
.zone .lab{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:rgba(28,36,51,.42)}
.zone.hot{border-color:var(--sapph);box-shadow:0 0 0 2px rgba(31,95,168,.35) inset;background:rgba(31,95,168,.08)}
.handbar{position:absolute;left:0;width:100%;border-radius:10px;background:#e1e7ee;border:1px solid rgba(22,63,115,.12)}
.card{position:absolute;left:0;top:0;border-radius:3px;overflow:hidden;cursor:pointer;touch-action:none;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s ease,box-shadow .3s;box-shadow:0 2px 6px rgba(10,20,40,.3);background:#28344a}
.card img{position:relative;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.card .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;line-height:1.1;padding:3px;
  background:linear-gradient(#5a7fae,#24406b);color:#fff}
.card .back{position:absolute;inset:0;display:none;border:2px solid #20304a;
  background:radial-gradient(ellipse 22% 16% at 50% 50%,#bfe1ff 0 40%,transparent 44%),radial-gradient(ellipse 40% 30% at 50% 50%,#2f6fb8 0 60%,transparent 63%),linear-gradient(135deg,#1d2c47,#0f1a2e 60%,#1d2c47)}
.card .back::after{content:"";position:absolute;inset:18% 12%;border:1.5px solid rgba(191,225,255,.55);border-radius:50%}
.card.down .back{display:block}
.card.down img,.card.down .fb{visibility:hidden}
.card.mine.down.st .back::before{content:"Set";position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:8px;color:#d6e9ff;z-index:1}
.card .atk{position:absolute;left:0;right:0;bottom:0;z-index:2;font-size:8px;line-height:1.3;text-align:center;background:rgba(12,22,40,.78);color:#fff}
.card .atk:empty{display:none}
.card.dummy{background:linear-gradient(160deg,#8a4c46,#4d2622);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;line-height:1.15;padding:3px}
.card.osback .back{background:linear-gradient(135deg,#5a2a26,#2b1210 60%,#5a2a26);border-color:#3d1a16}
.card.act{box-shadow:0 0 0 2px var(--sapph),0 0 16px 4px rgba(90,160,240,.85);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--sapph),0 0 26px 8px rgba(90,160,240,.95)}}
.card.drag{transition:none;z-index:500!important;box-shadow:0 10px 24px rgba(10,20,40,.45)}
.pcount{position:absolute;font-size:10px;font-weight:600;color:#fff;background:rgba(22,63,115,.85);border-radius:8px;padding:0 5px;z-index:300;pointer-events:none}
.banner{position:absolute;left:0;right:0;text-align:center;font-family:var(--display);font-weight:700;color:var(--sapph2);text-shadow:0 0 10px #fff,0 0 4px #fff;pointer-events:none;z-index:600;animation:ban 2.2s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.3)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:4%;right:4%;transform:translateY(-50%);z-index:700;text-align:center;font-size:14px;line-height:1.35;
  background:#fff;color:var(--ink);border:1px solid var(--sapph);border-radius:8px;box-shadow:0 4px 14px rgba(10,20,40,.18);padding:9px 12px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}.toast.bad{border-color:var(--warn);color:var(--warn)}
.panel{display:grid;gap:9px;align-content:start}
.caption{background:#fff;border:1px solid rgba(22,63,115,.14);border-radius:10px;padding:11px 13px;min-height:90px}
.caption .k{font-family:var(--display);font-size:13px;color:var(--sapph2);margin-bottom:4px}
.caption p{margin:0}
.caption .why{margin-top:6px;font-size:14px;color:var(--mute)}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctrls .sp{margin-left:auto;font-size:14px;color:var(--mute);display:flex;gap:6px;align-items:center}
select{font-family:var(--ui);font-size:15px;background:#fff;color:var(--ink);border:1px solid rgba(22,63,115,.3);border-radius:6px;padding:8px;max-width:100%}
.opts{display:grid;gap:6px}
.opts button{text-align:left}
.opts button.bad{border-color:var(--warn);animation:shake .35s}
.opts button.good{border-color:#2e7d32;background:rgba(46,125,50,.08)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fbk{font-size:15px;color:var(--mute);min-height:22px}
.fbk.ok{color:#2e7d32}.fbk.no{color:var(--warn)}
.pstat{font-size:14px;color:var(--mute)}
.view{display:none}
.view h2{font-family:var(--display);font-size:17px;color:var(--sapph2);margin:14px 0 8px;font-weight:500}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.dcard{position:relative;cursor:pointer;border-radius:4px;overflow:hidden;aspect-ratio:59/86;background:#28344a;box-shadow:0 2px 6px rgba(10,20,40,.35);border:0;padding:0;min-height:0}
.dcard img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.dcard .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.15;padding:4px;color:#fff;background:linear-gradient(#5a7fae,#24406b)}
.dcard .q{position:absolute;right:3px;bottom:3px;background:var(--sapph2);color:#fff;border-radius:4px;font-size:12px;padding:0 5px}
.skillbox{background:#fff;border:1px solid rgba(22,63,115,.2);border-left:4px solid var(--sapph);border-radius:8px;padding:10px 12px;font-size:15px}
.skillbox b{font-family:var(--display);color:var(--sapph2);font-weight:500}
.lesson{background:#fff;border:1px solid rgba(22,63,115,.14);border-radius:10px;margin:0 0 8px;overflow:hidden}
.lesson summary{cursor:pointer;padding:11px 13px;font-family:var(--display);font-size:15px;color:var(--sapph2);list-style:none;display:flex;gap:10px;align-items:baseline}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary .n{font-family:var(--ui);font-size:13px;color:var(--silver);min-width:16px}
.lesson[open] summary{border-bottom:1px solid rgba(22,63,115,.1)}
.lesson .body{padding:8px 14px 12px;font-size:15px;max-width:68ch}
.lesson .body p{margin:6px 0}
.lesson .body ul{margin:6px 0;padding-left:20px}.lesson .body li{margin:3px 0}
.intro{font-size:15px;color:var(--mute);max-width:68ch;margin:4px 0 10px}
.modal{position:fixed;inset:0;background:rgba(14,22,36,.55);display:none;align-items:center;justify-content:center;z-index:800;padding:14px}
.modal.on{display:flex}
.mbox{max-width:760px;width:100%;max-height:min(80vh,620px);background:#fbfcfd;border:1px solid var(--sapph);border-radius:12px;padding:10px;display:grid;gap:10px;grid-template-columns:34% minmax(0,1fr);align-items:start}
.mbox img{width:100%;border-radius:5px;box-shadow:0 4px 12px rgba(10,20,40,.5)}
.mtext{display:flex;flex-direction:column;gap:8px;max-height:calc(min(80vh,620px) - 20px);min-height:0}
.mscroll{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.mbox h3{font-family:var(--display);color:var(--sapph2);margin:0;font-size:15px;line-height:1.2}
.mbox .tl{font-size:13px;color:var(--mute)}
.mbox .role{background:rgba(31,95,168,.07);border-left:3px solid var(--sapph);padding:6px 8px;font-size:13px;line-height:1.35}
.mbox .desc{font-size:12px;line-height:1.45;color:var(--mute);white-space:pre-line}
.mbox .acts{display:grid;gap:5px}.mbox .acts button{text-align:left;font-size:14px;min-height:38px;padding:7px 10px}
.mbox .acts .h{font-size:12px;color:var(--mute)}
@media (min-width:760px){.mbox{grid-template-columns:280px minmax(0,1fr);padding:14px;gap:14px}.mbox h3{font-size:19px}.mbox .role{font-size:15px}.mbox .desc{font-size:14px}}
.sheet{max-width:440px;width:100%;max-height:84vh;overflow:auto;background:#fbfcfd;border:1px solid var(--sapph);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px}
.sheet h3{font-family:var(--display);color:var(--sapph2);margin:0;font-size:16px}
.sheet .sub{font-size:14px;color:var(--mute);margin:0}
.sheet button{text-align:left}
.sheet button.cancel{text-align:center;margin-top:4px}
.sheet button .w{display:block;font-size:12.5px;color:var(--mute);margin-top:2px;line-height:1.3}
.sheet button.best{border-color:var(--sapph);box-shadow:0 0 0 1px var(--sapph) inset}
.sheet ol{margin:0;padding-left:22px}.sheet ol li{margin:6px 0;font-size:14.5px}
.sheet ol li .w{display:block;font-size:12.5px;color:var(--mute)}
.sheet ol li.done{opacity:.45}
.sheet .note{font-size:13px;color:var(--mute);margin:0}
.pview .pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.pview .pc{position:relative;aspect-ratio:59/86;border-radius:4px;overflow:hidden;background:#28344a;cursor:pointer;padding:0;min-height:0;border:0}
.pview .pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bigcard{position:fixed;inset:0;z-index:900;background:rgba(10,14,22,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.bigcard img{max-width:100%;max-height:calc(100% - 40px);border-radius:10px}
.bigcard p{color:#fff;opacity:.75;margin:10px 0 0;font-size:14px}
.dmode{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.dmode button{padding:6px 9px;font-size:13px;min-height:34px}
.dmode button.on{background:var(--sapph);color:#fff;border-color:var(--sapph)}
.hint{font-size:14px;color:var(--mute);margin:0}
@media (min-width:980px){.main{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:18px;align-items:start}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card.act,.banner,.opts button.bad{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Blue-Eyes Trainer</h1>
    <div class="tabs" role="tablist">
      <button id="tLearn" class="on">Learn</button>
      <button id="tWatch">Watch</button>
      <button id="tPractice">Practice</button>
      <button id="tPlay">Play</button>
      <button id="tDeck">Deck</button>
    </div>
  </header>

  <div class="view" id="learnview"></div>

  <div class="main view" id="duelview">
    <div>
      <div class="lp"><span>Opponent<b id="lpO">4000</b></span><span>You<b id="lpM">4000</b></span></div>
      <div class="stage" id="stage"></div>
    </div>
    <div class="panel">
      <div class="caption"><div class="k" id="stepk"></div><p id="cap"></p><div class="why" id="capw"></div></div>
      <div id="watchCtrls" class="ctrls">
        <button id="bPrev">◀ Back</button>
        <button id="bPlay" class="primary">Auto play</button>
        <button id="bNext">Next ▶</button>
        <button id="bTurn" class="primary" style="display:none">Next turn ▶</button>
        <select id="wPick" aria-label="Choose a hand"></select>
        <button id="bRand">🎲 Random hand</button>
        <label class="sp">Speed <select id="speed"><option value="1.7">Slow</option><option value="1" selected>Normal</option><option value="0.6">Fast</option></select></label>
      </div>
      <div id="practice" style="display:none" class="panel">
        <div class="k" style="font-family:var(--display);color:var(--sapph2)">What’s your best move?</div>
        <div class="opts" id="opts"></div>
        <div class="fbk" id="fbk"></div>
        <div class="ctrls"><button id="qUndo" disabled>↶ Undo</button><button id="qReset">Start over</button><button id="qRand">🎲 New hand</button>
          <button id="qTurn" class="primary" style="display:none">Next turn ▶</button><span class="sp" id="score"></span></div>
        <div class="dmode"><span>Practice:</span><button data-q="first" class="on">Going first</button><button data-q="second">Going second</button></div>
      </div>
      <div id="playCtrls" style="display:none" class="panel">
        <div class="ctrls">
          <button id="pPhase" class="primary">Battle ▶</button><button id="pEnd">End turn</button><button id="pUndo" disabled>↶ Undo</button>
          <button id="pSkill">⚡ Skill</button><button id="pWhat">💡 What now?</button><button id="pBest">🧠 Best play</button>
          <button id="pBan">Banished (0)</button><button id="pOpp">Opponent’s cards</button><button id="pNew">New duel</button><button id="pHand">📊 This hand</button><button id="pAsk">💬 Ask Claude</button>
        </div>
        <div class="pstat" id="pstat"></div>
        <div class="dmode" id="dmode">Drag cards to play them as:
          <button data-m="a" class="on">Attack / activate</button><button data-m="d">Defense / Set</button></div>
      </div>
      <p class="hint" id="hint">Tap any card to see its art and full text.</p>
    </div>
  </div>

  <div class="view" id="deckview"></div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div id="mwrap" style="display:contents"></div></div>

<script id="engineSrc">
/* Blue-Eyes Speed Duel engine: real card effects for this 20-card deck + Skill, and a best-play solver. */
(function (G) {
'use strict';
const C = {
  BEWD: {n:'Blue-Eyes White Dragon', id:89631139, t:'m', lv:8, atk:3000, def:2500, race:'Dragon', normal:1, be:1, sub:'Normal Monster'},
  ALT: {n:'Blue-Eyes Alternative White Dragon', id:38517737, t:'m', lv:8, atk:3000, def:2500, race:'Dragon', be:1, nomi:1, eff:1, sub:'Effect Monster'},
  DSW: {n:'Dragon Spirit of White', id:45467446, t:'m', lv:8, atk:2500, def:2000, race:'Dragon', be:1, eff:1, sub:'Effect Monster'},
  SAGE: {n:'Sage with Eyes of Blue', id:8240199, t:'m', lv:1, atk:0, def:1500, race:'Spellcaster', tuner:1, eff:1, sub:'Tuner Effect Monster'},
  STONE: {n:'The White Stone of Ancients', id:71039903, t:'m', lv:1, atk:600, def:500, race:'Dragon', tuner:1, eff:1, sub:'Tuner Effect Monster'},
  MEL: {n:'The Melody of Awakening Dragon', id:48800175, t:'s', sub:'Normal Spell'},
  CON: {n:'Cards of Consonance', id:39701395, t:'s', sub:'Normal Spell'},
  MST: {n:'Mystical Space Typhoon', id:5318639, t:'s', sub:'Quick-Play Spell', qp:1},
  RB: {n:'Raigeki Break', id:4178474, t:'t', sub:'Normal Trap'},
  BURST: {n:'Burst Stream of Destruction', id:17655904, t:'s', sub:'Normal Spell'},
  AZ: {n:'Azure-Eyes Silver Dragon', id:40908371, t:'x', lv:9, atk:2500, def:3000, race:'Dragon', eff:1, sub:'Synchro Monster'},
  SPI: {n:'Blue-Eyes Spirit Dragon', id:59822133, t:'x', lv:9, atk:2500, def:3000, race:'Dragon', be:1, eff:1, sub:'Synchro Monster'},
  OM: {n:'Opponent’s monster', t:'om', atk:2000, def:1200, race:'Warrior'},
  OD: {n:'Opponent’s wall', t:'om', atk:1000, def:2500, race:'Rock'},
  OS: {n:'Opponent’s Set card', t:'os'},
  UNK: {n:'(unknown draw)', t:'?'}
};
const DECK = ['BEWD','BEWD','BEWD','ALT','DSW','SAGE','SAGE','SAGE','STONE','STONE','STONE','MEL','MEL','MEL','CON','CON','MST','MST','RB','RB'];
const EXTRA = ['AZ','SPI','SPI'];
const N = c => C[c].n;
const isMon = c => C[c].t === 'm' || C[c].t === 'x';
const isST = c => C[c].t === 's' || C[c].t === 't';

function rng(seed) { let x = (seed >>> 0) || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; }; }
function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function clone(s) {
  const cards = {}; for (const u in s.cards) cards[u] = Object.assign({}, s.cards[u]);
  const z = {}; for (const k in s.z) z[k] = s.z[k].slice();
  return {turn: s.turn, active: s.active, phase: s.phase, first: s.first, lp: {me: s.lp.me, opp: s.lp.opp}, cards: cards, uid: s.uid,
    pend: s.pend.map(p => Object.assign({}, p)), log: [], win: s.win, z: z, f: Object.assign({}, s.f), sk: Object.assign({}, s.sk)};
}

function mk(s, c, zone, extra) {
  const u = (C[c].t === 'om' || C[c].t === 'os' ? 'o' : 'c') + (++s.uid);
  s.cards[u] = Object.assign({c: c, f: 'u', p: 'a'}, extra || {});
  if (zone) s.z[zone].push(u);
  return u;
}

/* opt: {first, seed, hand:[codes], order:[codes] (rest of deck top→bottom), opp:[codes]} */
function newDuel(opt) {
  opt = opt || {};
  const first = opt.first !== false;
  const s = {turn: first ? 1 : 2, active: 'me', phase: first ? 'main' : 'draw', first: first,
    lp: {me: 4000, opp: 4000}, cards: {}, uid: 0, pend: [], log: [], win: null,
    z: {deck: [], hand: [], gy: [], ban: [], ex: [], mz: [null, null, null], sz: [null, null, null], omz: [null, null, null], osz: [null, null, null], ogy: []},
    f: {}, sk: {s1: 0, s2: 0}};
  const pool = DECK.slice();
  const hand = [];
  (opt.hand || []).forEach(c => { const i = pool.indexOf(c); if (i >= 0) { pool.splice(i, 1); hand.push(c); } });
  let rest;
  if (opt.order) {
    rest = [];
    opt.order.forEach(c => { const i = pool.indexOf(c); if (i >= 0) { pool.splice(i, 1); rest.push(c); } });

'use strict';
const $ = id => document.getElementById(id);
const C = BE.C;

let MODE = 'learn';
let SHOWN = null;            // state currently on the stage
const els = new Map();
let GEO = null;

function layout() {
  const st = $('stage'); const W = Math.min(st.clientWidth || 360, 560);
  const cw = W * 0.142, ch = cw * 86 / 59, gap = cw * 0.12, pad = 6;
  const cx = [0.1, 0.3, 0.5, 0.7, 0.9].map(f => W * f);

  const H = hy + ch + pad + 4;
  GEO = {W, cw, ch, cx, r0, r1, r2, r3, hy, H, pad};
  st.style.height = H + 'px';
  st.innerHTML = '';
  const b = document.createElement('div'); b.className = 'board'; b.style.height = (hy - gap * 1.2) + 'px'; st.appendChild(b);
  const eye = document.createElement('div'); eye.className = 'eye'; eye.style.top = ((r1 + ch + r2) / 2) + 'px'; eye.style.width = (W * 0.5) + 'px'; eye.style.height = (gap * 2.2 + ch * 0.6) + 'px'; b.appendChild(eye);
  const hb = document.createElement('div'); hb.className = 'handbar'; hb.style.top = (hy - gap * 0.6) + 'px'; hb.style.height = (ch + gap * 1.2) + 'px'; st.appendChild(hb);

  for (let i = 0; i < 3; i++) { Z(cx[1 + i], r0, 'Spell/Trap', 'opp', 'z_osz' + i); Z(cx[1 + i], r1, 'Monster', 'opp', 'z_omz' + i); Z(cx[1 + i], r2, 'Monster', '', 'z_mz' + i); Z(cx[1 + i], r3, 'Spell/Trap', '', 'z_sz' + i); }

  Z(cx[0], r2, 'Field', 'pilez'); Z(cx[4], r2, 'GY', 'pilez', 'z_gy'); Z(cx[0], r3, 'Extra', 'pilez', 'z_ex'); Z(cx[4], r3, 'Deck', 'pilez', 'z_deck');

}
function slot(s, u) {
  const g = GEO, z = BE.zoneOf(s, u);
  if (!z) return null;
  const a = s.z[z], i = a.indexOf(u);
  switch (z) {
    case 'mz': return {x: g.cx[1 + i], y: g.r2};
    case 'sz': return {x: g.cx[1 + i], y: g.r3};
    case 'omz': return {x: g.cx[1 + i], y: g.r1};
    case 'osz': return {x: g.cx[1 + i], y: g.r0};
    case 'gy': return {x: g.cx[4], y: g.r2, pile: i};
    case 'ogy': return {x: g.cx[0], y: g.r1, pile: i};
    case 'deck': return {x: g.cx[4], y: g.r3, pile: a.length - i, hide: i > 2};
    case 'ex': return {x: g.cx[0], y: g.r3, pile: i};
    case 'ban': return {x: g.cx[4], y: g.r2, gone: 1};
    case 'hand': {
      const n = a.length, avail = g.W - 2 * g.pad - 8, step = n > 1 ? Math.min(g.cw + 5, (avail - g.cw) / (n - 1)) : 0;
      const total = g.cw + step * (n - 1); const x0 = (g.W - total) / 2 + g.cw / 2;
      return {x: x0 + step * i, y: g.hy, hand: i};
    }
  }
  return null;
}
function cardEl(s, u) {

  else if (info.t === 'os') { e.classList.add('osback'); e.innerHTML = '<div class="back"></div>'; }
  else {

  }
  e.style.transform = 'translate(' + (GEO.W / 2) + 'px,' + GEO.hy + 'px)';

    e.style.transform = `translate(${p.x - GEO.cw / 2 + pileOff}px,${p.y + pileOff}px) rotate(${def ? 90 : 0}deg)`;
    e.style.opacity = p.gone || p.hide ? '0' : '1';
    e.style.pointerEvents = p.gone || p.hide ? 'none' : '';
    const z = BE.zoneOf(s, u);
    e.style.zIndex = z === 'hand' ? 200 + p.hand : (p.pile != null ? 10 + p.pile : 60);
    const down = d.f === 'd';
    e.classList.toggle('down', down);
    e.classList.toggle('mine', u[0] === 'c');
    e.classList.toggle('st', z === 'sz');
    const a = e.querySelector('.atk');
    if (a) a.textContent = (z === 'mz' && !down && (C[d.c].t === 'm' || C[d.c].t === 'x')) ? (d.p === 'd' ? 'DEF ' + C[d.c].def : C[d.c].atk + ' ATK') + (BE.prot(s, u) ? ' 🛡' : '') : '';
    if (instant) { void e.offsetWidth; e.style.transition = ''; }
  }

  ['Your Skill: Destiny Draw: Blue-Eyed Dragons', `<p>It has two effects, and each one works <b>once per Duel</b>.</p>
   <p><b>First effect, before your normal draw:</b> you Set Burst Stream of Destruction from outside your Deck, your draw becomes Blue-Eyes White Dragon, and for that turn Blue-Eyes needs no Tributes. You also get 1 extra Normal Summon, for Blue-Eyes only. Because it happens before your draw, the earliest you can use it is turn 1 if you go second, or your second turn if you go first.</p>
   <p><b>Second effect, in your Main Phase:</b> reveal a LIGHT monster from your hand (every monster in this deck is LIGHT), put it on the bottom of your Deck or send it to the GY, then draw 2. Sending White Stone to the GY this way also triggers its End Phase summon.</p>`, 5],
  ['Your engine: Sage and White Stone', `<p><b>Sage with Eyes of Blue</b> is your best starter. Normal Summon it and add <b>The White Stone of Ancients</b> from your Deck.</p>
   <p>White Stone’s key rule: if it went to the GY <i>this turn</i>, it Special Summons a Blue-Eyes from your Deck in the End Phase. It doesn’t matter how it got there: discarded for Melody or Cards of Consonance, Tributed, used as Synchro material, or sent by your Skill.</p>
   <p>Melody of Awakening Dragon is how you turn one card into two Blue-Eyes. Discard White Stone to it whenever you can.</p>`, 0],
  ['Synchro Summoning: 1 + 8 = 9', `<p>A Synchro Summon sends a face-up <b>Tuner</b> and face-up non-Tuners from your field to the GY. Their Levels must add up exactly to the Synchro monster’s Level.</p>
   <ul><li>Your Tuners are Sage and White Stone, both Level 1. Every Blue-Eyes main monster is Level 8. That’s exactly 9.</li>
   <li><b>Blue-Eyes Spirit Dragon</b> takes a Tuner + any Blue-Eyes, including Alternative and Dragon Spirit of White.</li>
   <li><b>Azure-Eyes Silver Dragon</b> needs a Tuner + a <i>Normal</i> Monster. Only the real Blue-Eyes White Dragon works; Alternative and Dragon Spirit of White are Effect Monsters on the field.</li></ul>
   <p>Using White Stone as material also counts as sending it to the GY, so it summons again in the End Phase.</p>`, 2],
  ['The Spirit Dragon → Azure-Eyes trick', `<p>Blue-Eyes Spirit Dragon can Tribute itself, even during your opponent’s turn, to Special Summon Azure-Eyes in Defense Position. The summoned monster is supposed to be destroyed in the End Phase.</p>
   <p>Azure-Eyes stays anyway: when it’s Special Summoned, your Dragons can’t be targeted or destroyed by card effects until the end of the next turn, and that includes Azure itself.</p>
   <p>The best time is usually your opponent’s turn, in response to them trying to remove Spirit Dragon. Note that the protection also stops <i>you</i> from targeting your own Dragons, for example with Sage’s effect.</p>`, 0],
  ['Tribute Summons and your Normal Summon', `<p>You get 1 Normal Summon or Set per turn. Level 5 and 6 monsters need 1 Tribute; Level 7 and higher need 2.</p>
   <p>Blue-Eyes White Dragon is Level 8, so without your Skill it needs 2 Tributes. Sage + White Stone make good Tributes, and the Tributed White Stone summons another Blue-Eyes in the End Phase.</p>
   <p>Alternative never uses your Normal Summon: you Special Summon it from your hand by revealing a Blue-Eyes White Dragon. It can’t be summoned from the Deck by Sage or White Stone.</p>`, 4],
  ['Removal: when to use what', `<ul><li><b>Raigeki Break</b> is a Trap. Set it, then use it from your opponent’s next turn on, ideally right after they summon their best monster. Its cost is a discard.</li>
   <li><b>Mystical Space Typhoon</b> answers a Spell or Trap. Set it to use during their turn.</li>
   <li><b>Alternative</b> destroys a monster once per turn, but then it can’t attack.</li>
   <li><b>Dragon Spirit of White</b> banishes a Spell or Trap whenever it’s summoned, including by White Stone in the End Phase.</li>
   <li><b>Burst Stream</b> (from your Skill) wipes their monsters if you control Blue-Eyes White Dragon. Your Blue-Eyes White Dragons can’t attack that turn, but your other monsters can.</li></ul>`, 6],
  ['Common mistakes', `<ul><li>Using White Stone’s banish effect the same turn it went to the GY, which throws away its End Phase summon.</li>
   <li>Expecting Melody to find Dragon Spirit of White. It only has 2500 ATK, and Melody needs 3000.</li>
   <li>Trying to use Alternative or Dragon Spirit of White for Azure-Eyes. Only the real Blue-Eyes White Dragon is a Normal Monster on the field.</li>
   <li>Battling before you’re done. There’s no Main Phase 2.</li>
   <li>Filling all 3 Monster Zones before the End Phase, which leaves no room for White Stone’s summon.</li></ul>`, 1]
];
function buildLearn() {
  let h = '<p class="intro">Short lessons on Speed Duel rules and how this deck plays. Each one links to a walkthrough you can watch step by step.</p>';
  LESSONS.forEach((L, i) => { h += '<details class="lesson"' + (i === 0 ? ' open' : '') + '><summary><span class="n">' + (i + 1) + '</span>' + L[0] + '</summary><div class="body">' + L[1] + '<p><button data-w="' + L[2] + '">Watch: ' + SAMPLES[L[2]].name + '</button></p></div></details>'; });
  $('learnview').innerHTML = h;
  document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { Wt.pick = +b.dataset.w; $('wPick').value = Wt.pick; setMode('watch'); wStart(SAMPLES[Wt.pick]); });
}
function buildDeck() {
  const count = {}; BE.DECK.forEach(c => count[c] = (count[c] || 0) + 1);
  const cell = (c, n) => '<button class="dcard" data-c="' + c + '" aria-label="' + C[c].n + '"><span class="fb">' + C[c].n + '</span><img src="' + IMG_S(C[c].id) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' + (n > 1 ? '<span class="q">×' + n + '</span>' : '') + '</button>';
  const grp = list => '<div class="dgrid">' + list.map(c => cell(c, count[c] || 1)).join('') + '</div>';
  const ec = {}; BE.EXTRA.forEach(c => ec[c] = (ec[c] || 0) + 1);
  $('deckview').innerHTML = '<h2>Skill</h2><div class="skillbox"><b>Destiny Draw: Blue-Eyed Dragons</b><br>' + esc(SKILL_TEXT) + '</div>' +
    '<h2>Monsters (11)</h2>' + grp(['BEWD', 'ALT', 'DSW', 'SAGE', 'STONE']) + '<h2>Spells (7)</h2>' + grp(['MEL', 'CON', 'MST']) + '<h2>Traps (2)</h2>' + grp(['RB']) +
    '<h2>Extra Deck (3)</h2><div class="dgrid">' + ['AZ', 'SPI'].map(c => cell(c, ec[c])).join('') + '</div><h2>From your Skill</h2>' + grp(['BURST']) +
    '<p class="intro" style="margin-top:12px">Tap a card for its role in the deck and its full text.</p>';
  document.querySelectorAll('.dcard').forEach(b => b.onclick = () => openCard(b.dataset.c, null));
}

/* ---------------- tabs ---------------- */
function setMode(m) {
  MODE = m; closeModal(); stopAuto();
  ['learn', 'watch', 'practice', 'play', 'deck'].forEach(x => $('t' + x[0].toUpperCase() + x.slice(1)).classList.toggle('on', x === m));
  $('learnview').style.display = m === 'learn' ? 'block' : 'none';
  $('deckview').style.display = m === 'deck' ? 'block' : 'none';
  $('duelview').style.display = (m === 'watch' || m === 'practice' || m === 'play') ? '' : 'none';
  if (m === 'watch' || m === 'practice' || m === 'play') $('duelview').style.display = window.innerWidth >= 980 ? 'grid' : 'block';
  $('watchCtrls').style.display = m === 'watch' ? '' : 'none';
  $('practice').style.display = m === 'practice' ? '' : 'none';
  $('playCtrls').style.display = m === 'play' ? '' : 'none';
  $('hint').textContent = m === 'play' ? 'Tap a card for details and its legal plays. Drag to play it, hold for its effects, double-tap a monster to change position.' : 'Tap any card to see its art and full text.';
  if (m === 'watch' || m === 'practice' || m === 'play') {
    layout();
    if (m === 'watch') { if (!Wt.steps.length) wStart(SAMPLES[Wt.pick]); else wShow(); }
    if (m === 'practice') { if (!Q.s) qNew(); else qAsk(); }
    if (m === 'play') { if (!P.s) newPlay(true); else { render(P.s, true); afterPlay(); } }
  }
  window.scrollTo(0, 0);
}
['learn', 'watch', 'practice', 'play', 'deck'].forEach(x => $('t' + x[0].toUpperCase() + x.slice(1)).onclick = () => setMode(x));
let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if ($('duelview').style.display !== 'none') { const s = SHOWN; layout(); if (s) render(s, true); } }, 150); });
buildLearn(); buildDeck(); setMode('learn');
Object.values(C).forEach(i => { if (i.id) { const im = new Image(); im.src = IMG_S(i.id); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
